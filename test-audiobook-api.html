<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Audiobook API</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="Images/favicon.jpg" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body class="bg-gray-900 text-gray-300">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-white mb-8 text-center">
            <i class="bi bi-headphones me-3 text-green-500"></i>
            Free Audiobook API Test
        </h1>
        
        <div class="max-w-4xl mx-auto">
            <div class="bg-gray-800 rounded-lg p-6 mb-6">
                <h2 class="text-xl font-semibold text-white mb-4">API Status</h2>
                <div id="apiStatus" class="text-gray-300">
                    <i class="bi bi-arrow-clockwise animate-spin me-2"></i>
                    Testing API connection...
                </div>
            </div>
            
            <div class="bg-gray-800 rounded-lg p-6 mb-6">
                <h2 class="text-xl font-semibold text-white mb-4">Sample Audiobooks</h2>
                <div id="sampleBooks" class="text-gray-300">
                    Loading sample audiobooks...
                </div>
            </div>
            
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-semibold text-white mb-4">Search Test</h2>
                <div class="flex gap-4 mb-4">
                    <input type="text" id="searchInput" placeholder="Search for audiobooks..." 
                           class="flex-1 bg-gray-700 text-white p-3 rounded-lg border border-gray-600 focus:outline-none focus:border-green-500">
                    <button id="searchBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg transition-colors">
                        <i class="bi bi-search me-2"></i>Search
                    </button>
                </div>
                <div id="searchResults" class="text-gray-300">
                    Enter a search term to test the API search functionality.
                </div>
            </div>
        </div>
    </div>

    <script src="audiobook-api.js"></script>
    <script>
        const apiService = new AudiobookAPIService();
        
        // Test API connection
        async function testAPI() {
            const statusDiv = document.getElementById('apiStatus');
            try {
                const books = await apiService.fetchAudiobooks({ limit: 5 });
                if (books && books.length > 0) {
                    statusDiv.innerHTML = `
                        <i class="bi bi-check-circle text-green-500 me-2"></i>
                        API connection successful! Found ${books.length} audiobooks.
                    `;
                    displaySampleBooks(books);
                } else {
                    statusDiv.innerHTML = `
                        <i class="bi bi-exclamation-triangle text-yellow-500 me-2"></i>
                        API connected but no books found. Using fallback data.
                    `;
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <i class="bi bi-x-circle text-red-500 me-2"></i>
                    API connection failed: ${error.message}
                `;
            }
        }
        
        function displaySampleBooks(books) {
            const container = document.getElementById('sampleBooks');
            container.innerHTML = books.map(book => `
                <div class="border border-gray-600 rounded-lg p-4 mb-4">
                    <div class="flex items-start gap-4">
                        <img src="${book.cover}" alt="${book.title}" class="w-20 h-28 object-cover rounded">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-white">${book.title}</h3>
                            <p class="text-gray-400">by ${book.author}</p>
                            <p class="text-sm text-gray-500">${book.genre} • ${book.duration}h • ${book.narrator}</p>
                            <p class="text-sm text-gray-300 mt-2">${book.description}</p>
                            <div class="mt-3 flex gap-2">
                                ${book.hasAudio ? `
                                    <button onclick="playAudiobook('${book.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm">
                                        <i class="bi bi-play me-1"></i>Play
                                    </button>
                                    <button onclick="downloadAudiobook('${book.id}')" class="bg-orange-600 hover:bg-orange-700 text-white px-3 py-1 rounded text-sm">
                                        <i class="bi bi-download me-1"></i>Download
                                    </button>
                                ` : `
                                    <span class="text-gray-500 text-sm">No audio available</span>
                                `}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Search functionality
        document.getElementById('searchBtn').addEventListener('click', async () => {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('searchResults');
            
            if (!query.trim()) {
                resultsDiv.innerHTML = 'Please enter a search term.';
                return;
            }
            
            resultsDiv.innerHTML = '<i class="bi bi-arrow-clockwise animate-spin me-2"></i>Searching...';
            
            try {
                const results = await apiService.searchAudiobooks(query, { limit: 10 });
                if (results && results.length > 0) {
                    resultsDiv.innerHTML = `
                        <div class="text-green-500 mb-2">
                            <i class="bi bi-check-circle me-2"></i>
                            Found ${results.length} results for "${query}"
                        </div>
                        ${results.map(book => `
                            <div class="border border-gray-600 rounded p-3 mb-2">
                                <strong>${book.title}</strong> by ${book.author}
                                <span class="text-gray-500 text-sm ml-2">(${book.genre})</span>
                            </div>
                        `).join('')}
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="text-yellow-500">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            No results found for "${query}"
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="text-red-500">
                        <i class="bi bi-x-circle me-2"></i>
                        Search failed: ${error.message}
                    </div>
                `;
            }
        });
        
        // Initialize test
        testAPI();
    </script>
</body>
</html>
